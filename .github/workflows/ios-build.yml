# BrickIt iPad: builds an unsigned .ipa on a GitHub macOS runner (no Mac needed).
# Install: download the .ipa from the release « ipad » (Releases of the repository), open it in Sideloadly on the PC
# (free Apple ID, iPad on USB). A free Apple ID signs for 7 days: install again from Sideloadly after that,
# the data of the app is kept as long as the app is not deleted.
#
# The app (port/): the shared BrickIt code drawn by the Lit renderer of the WZX engine (Diligent Engine, Vulkan
# translated to Metal by MoltenVK). The engine is the private submodule engine/: the repository secret ENGINE_TOKEN
# (a fine-grained token, contents read-only on wzx-rc/WZX-ENGINE) lets the runner fetch it. Without the secret, the
# J0 test app (ios/: Metal only, no engine) is built instead.
name: iPad build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner (macos-15-intel when the arm64 runners are saturated)
        default: macos-latest
  push:
    branches: [main, 'claude/**']
    paths: [ios/**, port/**, src/brickit/**, engine, assets/brickit/**, tools/brickit/library_fetch.py, VERSION, .github/workflows/ios-build.yml]

env:
  MOLTENVK_VERSION: v1.4.1

permissions:
  contents: write   # the release « ipad » that carries the .ipa

jobs:
  build-ipa:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Engine submodule (private, ENGINE_TOKEN)
        id: engine
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: |
          if [ -z "$ENGINE_TOKEN" ]; then
            echo "::warning::No ENGINE_TOKEN secret: the J0 test app is built (see docs/brickit/PORTAGE_IPAD.md)"
            echo "have=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config --global url."https://x-access-token:${ENGINE_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --depth 1 engine
          git -C engine log --oneline -1
          echo "have=true" >> "$GITHUB_OUTPUT"

      # The full LDraw library (22 545 parts, thumbnails): the data branch bibliotheque, published from the PC by
      # tools/brickit/library_publish.py; bundled in the .ipa as assets/brickit/full (Library::fullLibraryDir).
      - name: Full library (branch bibliotheque)
        if: steps.engine.outputs.have == 'true'
        run: |
          if git ls-remote --exit-code --heads origin bibliotheque >/dev/null; then
            python3 tools/brickit/library_fetch.py assets/brickit/full
            if [ -f assets/brickit/full/thumbs_hq.pack ]; then   # the HD thumbnails, 512 -> 384 px for the iPad
              python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
              python3 tools/brickit/thumbs_resize.py assets/brickit/full/thumbs_hq.pack 384
            fi
            du -sh assets/brickit/full
          else
            echo "::warning::No branch bibliotheque: the iPad gets the base and Technic parts only"
          fi

      - name: MoltenVK (static library for iOS)
        if: steps.engine.outputs.have == 'true'
        run: |
          curl -sSL -o MoltenVK-ios.tar \
            "https://github.com/KhronosGroup/MoltenVK/releases/download/${MOLTENVK_VERSION}/MoltenVK-ios.tar"
          tar xf MoltenVK-ios.tar
          echo "MOLTENVK_LIBRARY=$PWD/MoltenVK/MoltenVK/static/MoltenVK.xcframework/ios-arm64/libMoltenVK.a" >> "$GITHUB_ENV"

      # Diligent Engine (hundreds of files) is rebuilt only when its setup changes: the Xcode build folder is cached,
      # our own sources recompile incrementally. Saved even when the build fails.
      - name: Restore the build directory
        if: steps.engine.outputs.have == 'true'
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: build/ios
          key: ipad-${{ env.MOLTENVK_VERSION }}-${{ hashFiles('port/CMakeLists.txt', '.github/workflows/ios-build.yml') }}-${{ github.sha }}
          restore-keys: |
            ipad-${{ env.MOLTENVK_VERSION }}-${{ hashFiles('port/CMakeLists.txt', '.github/workflows/ios-build.yml') }}-
            ipad-${{ env.MOLTENVK_VERSION }}-

      - name: Configure (Xcode project)
        run: |
          if [ "${{ steps.engine.outputs.have }}" = "true" ]; then SRC=port; EXTRA="-DMOLTENVK_LIBRARY=$MOLTENVK_LIBRARY"; else SRC=ios; EXTRA="-DBRICKIT_GIT=$(git rev-parse --short HEAD)"; fi
          # -g + dwarf-with-dsym: the symbols of each build in BrickIt.app.dSYM (published next to the .ipa), to read the
          # crash reports of the iPad (Rapports/crash_*.txt, MetricKit, .ips): atos -o <dSYM> -l <adresse de chargement> ...
          # the restored build folder may carry the git path of an older runner image (FetchContent then fails with
          # « Git_VERSION='' »): the sub-builds of the fetched sources find git again, and the current git is given
          find build/ios -path '*-subbuild/CMakeCache.txt' -delete 2>/dev/null || true
          find build/ios -path '*-subbuild/CMakeFiles' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          cmake -S $SRC -B build/ios -G Xcode -DGIT_EXECUTABLE="$(command -v git)" \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -g" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -g" \
            -DCMAKE_XCODE_ATTRIBUTE_DEBUG_INFORMATION_FORMAT=dwarf-with-dsym -DCMAKE_XCODE_ATTRIBUTE_GCC_GENERATE_DEBUGGING_SYMBOLS=YES \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO -DBRICKIT_BUILD="${{ github.run_number }}" $EXTRA

      - name: Build unsigned .app
        run: |
          cmake --build build/ios --config Release --target BrickIt -- \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          APP=$(find build/ios -path "*Release-iphoneos/BrickIt.app" -maxdepth 3 -type d | head -1)
          test -n "$APP" || { echo "No .app built"; find build/ios -name "*.app"; exit 1; }
          if [ "${{ steps.engine.outputs.have }}" = "true" ]; then
            test -f "$APP/assets/brickit/base.json" && test -f "$APP/shaders/Raster.hlsl" || { ls -R "$APP" | head -50; exit 1; }
            KIND=lit
          else
            KIND=j0
          fi
          mkdir -p build/Payload
          rm -rf build/Payload/BrickIt.app
          cp -R "$APP" build/Payload/
          NAME="BrickIt-iPad-$(cat VERSION | tr -d '[:space:]')-$KIND-$(git rev-parse --short HEAD).ipa"
          (cd build && rm -f *.ipa *.dSYM.zip && zip -qr "$NAME" Payload)
          echo "IPA=build/$NAME" >> "$GITHUB_ENV"
          # the symbols of this very build (the UUID in a crash report matches: dwarfdump --uuid)
          DSYM=$(find build/ios -path "*Release-iphoneos/BrickIt.app.dSYM" -maxdepth 3 -type d | head -1)
          if [ -n "$DSYM" ]; then
            (cd "$(dirname "$DSYM")" && zip -qr "$GITHUB_WORKSPACE/build/${NAME%.ipa}.dSYM.zip" BrickIt.app.dSYM)
            echo "DSYM=build/${NAME%.ipa}.dSYM.zip" >> "$GITHUB_ENV"
            dwarfdump --uuid "$DSYM" || true
          else
            echo "::warning::No BrickIt.app.dSYM: the crash reports will not get function names"
          fi
          ls -la build/*.ipa build/*.dSYM.zip 2>/dev/null || true

      - name: Save the build directory
        if: always() && steps.engine.outputs.have == 'true'
        uses: actions/cache/save@v4
        with:
          path: build/ios
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      # The .ipa (about 700 MB with the full library) goes to the release « ipad » and not to an artifact: release files
      # do not count in the Actions storage (0.5 GB on the free plan, full with one .ipa). Only the last one is kept.
      - name: Publish the .ipa (release ipad)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N="$(basename "$IPA")"
          NOTES="Dernier build iPad : $N (branche ${GITHUB_REF_NAME}, ${GITHUB_SHA::7}). Télécharger le .ipa ci-dessous, l'ouvrir dans Sideloadly."
          if ! gh release view ipad >/dev/null 2>&1; then
            gh release create ipad --prerelease --target "$GITHUB_SHA" --title "BrickIt iPad" --notes "$NOTES"
          fi
          gh release upload ipad "$IPA" --clobber
          D=""
          if [ -n "$DSYM" ] && [ -f "$DSYM" ]; then gh release upload ipad "$DSYM" --clobber; D="$(basename "$DSYM")"; fi
          gh release view ipad --json assets -q '.assets[].name' | while read -r a; do
            [ "$a" != "$N" ] && [ "$a" != "$D" ] && gh release delete-asset ipad "$a" -y || true
          done
          gh release edit ipad --notes "$NOTES"
          echo "::notice::.ipa : https://github.com/${GITHUB_REPOSITORY}/releases/tag/ipad"
